<body>
    <div id="app" class="container">
        <h1>Vue Frontend</h1>
        <p class="subtitle">Лабораторная работа №2 — Docker + Vue</p>

        <!-- Секция 1.0: Отправка имени -->
        <div class="section">
            <h2>📤 Версия 1.0: Отправить имя</h2>
            <div class="input-group">
                <input 
                    type="text" 
                    v-model="name" 
                    @keyup.enter="sendName"
                    placeholder="Введите имя"
                    :disabled="loading"
                >
                <button @click="sendName" :disabled="loading || !name.trim()">
                    <span v-if="loading" class="spinner"></span>
                    {{ loading ? 'Отправка...' : 'Отправить' }}
                </button>
            </div>
            <div v-if="message.text" class="message" :class="message.type">
                {{ message.text }}
            </div>
        </div>

        <!-- Секция 2.0: Просмотр данных -->
        <div class="section">
            <h2>📋 Версия 2.0: Просмотр данных</h2>
            <button @click="getNames" :disabled="loadingNames">
                <span v-if="loadingNames" class="spinner"></span>
                {{ loadingNames ? 'Загрузка...' : 'Показать имена' }}
            </button>
            <div class="names-list">
                <p v-if="names.length === 0" class="empty">Список пуст</p>
                <p v-for="(n, i) in names" :key="i">{{ i + 1 }}. {{ n }}</p>
            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    name: '',
                    loading: false,
                    loadingNames: false,
                    message: { text: '', type: '' },
                    names: []
                };
            },
            methods: {
                async sendName() {
                    if (!this.name.trim() || this.loading) return;
                    this.loading = true;
                    this.message = { text: '', type: '' };

                    try {
                        const res = await fetch('/api/send-name', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name: this.name })
                        });
                        const data = await res.json();
                        this.message = {
                            text: data.message || 'Данные отправлены',
                            type: 'success'
                        };
                        this.name = '';
                    } catch (e) {
                        this.message = {
                            text: 'Ошибка: ' + e.message,
                            type: 'error'
                        };
                    } finally {
                        this.loading = false;
                    }
                },
                async getNames() {
                    this.loadingNames = true;
                    try {
                        const res = await fetch('/api/get-names');
                        const text = await res.text();
                        this.names = text
                            .split('\n')
                            .map(s => s.trim())
                            .filter(s => s.length > 0);
                    } catch (e) {
                        this.names = [];
                    } finally {
                        this.loadingNames = false;
                    }
                }
            }
        }).mount('#app');
    <title>Frontend v2.0</title>
